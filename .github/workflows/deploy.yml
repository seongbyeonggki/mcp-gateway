name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push mcp-server
        uses: docker/build-push-action@v5
        with:
          context: ./mcp-server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mcp-server:latest

      - name: Build and push gateway
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gateway:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mcp-server:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/gateway:latest

            docker stop mcp-server || true
            docker rm mcp-server || true
            docker stop gateway || true
            docker rm gateway || true

            docker network create mcp-net || true

            docker run -d \
              --name mcp-server \
              --network mcp-net \
              --restart unless-stopped \
              -p 3001:3001 \
              ${{ secrets.DOCKERHUB_USERNAME }}/mcp-server:latest

            docker run -d \
              --name gateway \
              --network mcp-net \
              --restart unless-stopped \
              -p 3000:3000 \
              -e MCP_SERVER_URL=http://mcp-server:3001 \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/gateway:latest
